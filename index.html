<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Escena VR A-Frame</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <a-scene embedded vr-mode-ui="enabled: true">

        <a-assets>
            <a-asset-item id="tinker-obj" src="assests/tinker.obj" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="tinker-mtl" src="assests/obj.mtl" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-camera position="0 1.6 0" look-controls>
            <a-cursor 
                fuse="true" 
                fuse-timeout="1500" 
                color="yellow" 
                scale="0.8 0.8 0.8">
            </a-cursor>
        </a-camera>

        <a-obj-model
            src="#tinker-obj"
            mtl="#tinker-mtl"
            position="-14 0 -16"
            rotation="-90 0 0"
            scale="0.5 0.5 0.5">
        </a-obj-model>

        <a-sky color="#FAFAFA"></a-sky>

    </a-scene>
</body>
</html>
