<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Escena VR A-Frame</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <a-scene embedded vr-mode-ui="enabled: true">

        <a-assets>
            <!-- Corregido: 'assets' con una sola 's' -->
            <a-asset-item id="tinker-obj" src="assets/tinker.obj" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="tinker-mtl" src="assets/obj.mtl" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-camera position="0 1.6 0" look-controls>
            <a-cursor 
                fuse="true" 
                fuse-timeout="1500" 
                color="yellow" 
                scale="0.8 0.8 0.8">
            </a-cursor>
        </a-camera>

        <!-- Cercano a la cámara (a 3 metros frente a ti) para asegurar que lo veas -->
        <a-obj-model
            src="#tinker-obj"
            mtl="#tinker-mtl"
            position="0 1 -3"
            scale="1 1 1">
        </a-obj-model>

        <a-sky color="#FAFAFA"></a-sky>

    </a-scene>
</body>
</html>
